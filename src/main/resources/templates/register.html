<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Регистрация')}"></head>
<body class="auth">
<main class="auth-shell">
    <section class="auth-intro">
        <a class="brand" th:href="@{/}">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="m8 12.5 2.6 2.6L16 9.7"/></svg>
            <span>Tasks</span>
        </a>
        <h1>Начните с одной задачи.</h1>
        <ul class="auth-points">
            <li><span class="dot dot-high"></span>Каждый видит только свои задачи</li>
            <li><span class="dot dot-medium"></span>Пароли хранятся в BCrypt</li>
            <li><span class="dot dot-low"></span>Светлая и тёмная тема</li>
        </ul>
    </section>

    <section class="auth-card">
        <h2>Регистрация</h2>
        <p class="sub">Займёт меньше минуты.</p>

        <form method="post" th:action="@{/register}" th:object="${form}" class="form-stack" novalidate>
            <div class="field-row">
                <div class="field">
                    <label class="form-label" for="firstName">Имя</label>
                    <input class="form-control" th:field="*{firstName}" id="firstName" autocomplete="given-name"
                           th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{firstName}">Ошибка</div>
                </div>
                <div class="field">
                    <label class="form-label" for="lastName">Фамилия</label>
                    <input class="form-control" th:field="*{lastName}" id="lastName" autocomplete="family-name"
                           th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{lastName}">Ошибка</div>
                </div>
            </div>
            <div class="field">
                <label class="form-label" for="username">Логин</label>
                <input class="form-control" th:field="*{username}" id="username" autocomplete="username"
                       th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{username}">Ошибка</div>
            </div>
            <div class="field">
                <label class="form-label" for="email">Email</label>
                <input class="form-control" type="email" th:field="*{email}" id="email" autocomplete="email"
                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{email}">Ошибка</div>
            </div>
            <div class="field">
                <label class="form-label" for="password">Пароль</label>
                <input class="form-control" type="password" th:field="*{password}" id="password"
                       autocomplete="new-password"
                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
                <div class="form-text" th:unless="${#fields.hasErrors('password')}">Не меньше 8 символов</div>
                <div class="invalid-feedback" th:errors="*{password}">Ошибка</div>
            </div>
            <button type="submit" class="btn btn-primary w-100">Создать аккаунт</button>
        </form>

        <p class="auth-switch">Уже есть аккаунт? <a th:href="@{/login}">Войти</a></p>
    </section>
</main>
</body>
</html>
