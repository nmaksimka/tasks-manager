<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · Tasks'">Tasks</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/js/theme.js}"></script>
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>

<aside class="sidebar" th:fragment="sidebar">
    <div class="sidebar-top">
        <a class="brand" th:href="@{/}">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="m8 12.5 2.6 2.6L16 9.7"/></svg>
            <span>Tasks</span>
        </a>
        <a class="btn btn-primary new-task" th:href="@{/tasks/new}">
            <span>Новая задача</span><kbd>N</kbd>
        </a>
    </div>

    <nav class="nav-group" aria-label="Списки">
        <span class="nav-label">Задачи</span>
        <a th:each="f : ${filters}" class="nav-item"
           th:classappend="${query != null and query.filter == f} ? 'active'"
           th:href="${filterLinks[f.name()]}">
            <span class="nav-icon" th:classappend="'icon-' + ${#strings.toLowerCase(f.name())}"></span>
            <span class="nav-text" th:text="${f.title}">Все</span>
            <span class="count" th:if="${stats != null and stats.count(f) > 0}"
                  th:classappend="${f.name() == 'OVERDUE'} ? 'count-alert'"
                  th:text="${stats.count(f)}">0</span>
        </a>
    </nav>

    <nav class="nav-group" aria-label="Приоритет">
        <span class="nav-label">Приоритет</span>
        <a th:each="p : ${priorities}" class="nav-item"
           th:classappend="${query != null and query.priority == p} ? 'active'"
           th:href="${priorityLinks[p.name()]}">
            <span class="dot" th:classappend="'dot-' + ${#strings.toLowerCase(p.name())}"></span>
            <span class="nav-text" th:text="${p.title}">Высокий</span>
        </a>
    </nav>

    <div class="sidebar-foot">
        <a class="me" th:href="@{/profile}" th:if="${me != null}">
            <span class="avatar" th:text="${#strings.toUpperCase(#strings.substring(me.displayName, 0, 1))}">D</span>
            <span class="me-text">
                <span class="me-name" th:text="${me.displayName}">Демо</span>
                <span class="me-sub" th:text="'@' + ${me.username}">@demo</span>
            </span>
        </a>
        <div class="foot-actions">
            <button type="button" class="icon-btn" data-theme-toggle title="Сменить тему" aria-label="Сменить тему">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
            </button>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="icon-btn" title="Выйти" aria-label="Выйти">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4M10 16l-4-4 4-4M6 12h10"/></svg>
                </button>
            </form>
        </div>
    </div>
</aside>

<div th:fragment="flash" class="flash" th:if="${message}" role="status">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 12.5 4 4 8-9"/></svg>
    <span th:text="${message}">Готово</span>
</div>

<th:block th:fragment="queryFields(q)">
    <input type="hidden" name="filter" th:if="${q.filter.name() != 'ALL'}" th:value="${q.filter}">
    <input type="hidden" name="priority" th:if="${q.priority != null}" th:value="${q.priority}">
    <input type="hidden" name="q" th:if="${q.q != null}" th:value="${q.q}">
    <input type="hidden" name="sort" th:if="${q.sort.name() != 'NEWEST'}" th:value="${q.sort}">
</th:block>

</body>
</html>
