<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${query.filter.title})}"></head>
<body>
<div class="shell">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <main class="main">
        <header class="topbar">
            <div class="heading">
                <h1>
                    <span th:text="${query.filter.title}">Все</span>
                    <span class="heading-tag" th:if="${query.priority != null}" th:text="${query.priority.title}">Высокий</span>
                </h1>
                <p class="sub">
                    <span th:text="${#lists.size(tasks)} + ' ' + ${@plural.tasks(#lists.size(tasks))}">3 задачи</span>
                    <span class="sep">·</span>
                    <span th:text="'выполнено ' + ${stats.completionPercent()} + '%'">выполнено 40%</span>
                </p>
                <progress class="progress-line" max="100" th:value="${stats.completionPercent()}" value="40"></progress>
            </div>

            <form class="tools" method="get" th:action="@{/}" role="search">
                <input type="hidden" name="filter" th:if="${query.filter.name() != 'ALL'}" th:value="${query.filter}">
                <input type="hidden" name="priority" th:if="${query.priority != null}" th:value="${query.priority}">
                <label class="search">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
                    <input class="form-control" type="search" name="q" th:value="${query.q}"
                           placeholder="Поиск по задачам" aria-label="Поиск" data-search>
                    <kbd>/</kbd>
                </label>
                <select class="form-select" name="sort" aria-label="Сортировка" data-autosubmit>
                    <option th:each="s : ${sorts}" th:value="${s}" th:text="${s.title}"
                            th:selected="${query.sort == s}">Сначала новые</option>
                </select>
            </form>
        </header>

        <div th:replace="~{fragments/layout :: flash}"></div>

        <section class="task-list" th:unless="${#lists.isEmpty(tasks)}" aria-label="Задачи">
            <article class="task" th:each="task : ${tasks}"
                     th:classappend="${task.completed} ? 'is-done' : ''">
                <form class="check-form" method="post" th:action="@{/tasks/{id}/toggle(id=${task.id})}">
                    <th:block th:replace="~{fragments/layout :: queryFields(${query})}"></th:block>
                    <button type="submit" class="check" th:classappend="'check-' + ${#strings.toLowerCase(task.priority.name())}"
                            th:attr="aria-label=${task.completed} ? 'Вернуть в работу' : 'Отметить выполненной'">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6.5 12.5 3.6 3.6 7.4-8"/></svg>
                    </button>
                </form>

                <div class="task-body">
                    <a class="task-title" th:href="@{/tasks/{id}/edit(id=${task.id})}" th:text="${task.title}">Задача</a>
                    <p class="task-desc" th:if="${task.description}" th:text="${task.description}">Описание</p>
                    <div class="task-meta">
                        <span class="chip" th:classappend="'prio-' + ${#strings.toLowerCase(task.priority.name())}">
                            <span class="dot" th:classappend="'dot-' + ${#strings.toLowerCase(task.priority.name())}"></span>
                            <span th:text="${task.priority.title}">Средний</span>
                        </span>
                        <span class="chip due" th:if="${task.deadline}"
                              th:classappend="'due-' + ${#strings.toLowerCase(task.deadlineStatus.name())}">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>
                            <span th:switch="${task.deadlineStatus.name()}">
                                <span th:case="'OVERDUE'" th:text="'Просрочено · ' + ${#temporals.format(task.deadline, 'd MMM')}">Просрочено</span>
                                <span th:case="'TODAY'">Сегодня</span>
                                <span th:case="*" th:text="${#temporals.format(task.deadline, 'd MMM')}">15 янв.</span>
                            </span>
                        </span>
                        <span class="chip ghost" th:if="${task.completed and task.completedAt != null}"
                              th:text="'Готово ' + ${#temporals.format(task.completedAt, 'd MMM, HH:mm')}">Готово</span>
                    </div>
                </div>

                <div class="task-actions">
                    <a class="icon-btn" th:href="@{/tasks/{id}/edit(id=${task.id})}" title="Изменить" aria-label="Изменить">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4Z"/><path d="m13.5 6.5 4 4"/></svg>
                    </a>
                    <form method="post" th:action="@{/tasks/{id}/delete(id=${task.id})}"
                          th:attr="data-confirm='Удалить задачу «' + ${task.title} + '»?'">
                        <button type="submit" class="icon-btn danger" title="Удалить" aria-label="Удалить">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>
                        </button>
                    </form>
                </div>
            </article>
        </section>

        <section class="empty" th:if="${#lists.isEmpty(tasks)}">
            <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="8" y="8" width="32" height="32" rx="9"/><path d="m17 24.5 5 5 9-10"/></svg>
            <h2 th:if="${query.q != null}">Ничего не нашлось</h2>
            <p th:if="${query.q != null}" th:text="'По запросу «' + ${query.q} + '» задач нет.'">По запросу задач нет.</p>
            <h2 th:if="${query.q == null}">Здесь пусто</h2>
            <p th:if="${query.q == null}">Задач в этом списке нет. Можно добавить новую.</p>
            <a class="btn btn-primary" th:href="@{/tasks/new}">Новая задача</a>
        </section>
    </main>
</div>
</body>
</html>
